<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VaVsta — мобильное приложение</title>
<style>
	body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#0d1226; color:#e6e9f5; margin:0; padding:0; display:flex; align-items:center; justify-content:center; min-height:100vh; }
	.card { max-width:480px; padding:40px 24px; text-align:center; }
	img { width:96px; height:96px; border-radius:22px; }
	h1 { font-size:22px; margin:16px 0 8px; }
	p  { font-size:15px; line-height:1.5; color:#aab2d0; margin:8px 0; }
	code { background:#1c2340; color:#8ab4ff; padding:2px 8px; border-radius:6px; font-size:13px; }
</style>
</head>
<body>
	<div class="card">
		<img src="/vavsta-icon.png" alt="VaVsta">
		<h1>VaVsta Messenger</h1>
		<p>Приложение продолжает развиваться. APK для Android обновляется с сервера — актуальную версию смотрите в разделе «О приложении» → «Проверить обновления».</p>
	</div>
</body>
</html>
